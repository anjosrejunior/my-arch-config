services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: ai-jail:latest
    container_name: ai-jail-my-arch-config
    volumes:
      - ..:/workspace:cached
    command: /bin/sh -c "while sleep 1000; do :; done"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4g
