# ####################################################################################
# Documentação: https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/
# Cores seguem o tema do Hyprland (fundo preto, detalhes amarelos).

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgb(000000)
    blur_passes = 2
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(f7d83b)
    inner_color = rgb(111111)
    font_color = rgb(f7d83b)
    fade_on_empty = false
    placeholder_text = <i>Senha...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}
