# ####################################################################################
# ///// HYPRIDLE — BLOQUEIO AUTOMÁTICO
# ####################################################################################
# Documentação: https://wiki.hypr.land/hypr-ecosystem/user/hypridle/

general {
    # Comando que bloqueia a tela (não abre duas instâncias do hyprlock).
    lock_cmd = pidof hyprlock || hyprlock
    # Bloqueia antes de suspender e ao receber o evento de bloqueio do logind.
    before_sleep_cmd = loginctl lock-session
}

# Após 5 minutos sem uso (mouse/teclado), bloqueia a sessão.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

